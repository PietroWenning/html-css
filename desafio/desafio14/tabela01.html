<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{font-family: Arial, Helvetica, sans-serif;}
        table{
            width: 400px;
            border-collapse:collapse ;
            text-align: left;
        }
        th, td{
            padding: 10px;
            border: 1px solid black;
        }
        .th{
            background-color: grey;
            color: white;

        }
        caption{
            
            padding: 10px;
            font-size: 23px;
            font-family: 'Courier New', Courier, monospace;
    
        }
    </style>
</head>
<body>
    <table>
        <caption><strong>Boletim</strong>
        </caption>
        <thead>
            <tr>
                <th  style="text-align: center;"
                class="th" rowspan="2" scope="col">Área</th>
                <th class="th" rowspan="2" scope="col">Disciplinas</th>
                <th class="th" colspan="2" >Notas</th>
                <th class="th" rowspan="2" scope="col">Média</th>
                
            </tr>
            <tr>
                <th class="th" scope="col">Nota01</th>
                <th class="th " scope="col">Nota02</th>
                
            </tr>
            
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td>Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th  class="th" colspan="4" scope="col">Média De Exatas</th>
                <td class="th">0.0</td>
            </tr>
            <th rowspan="3" scope="rowgroup">Humanas</th>
            <tr>
                <td>História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th class="th" colspan="4" scope="col">Média de Humanas</th>
                <td class="th">0.0</td>
            </tr>
        </tfoot>





    </table>
    
</body>
</html>
