<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        body{font-family: Arial, Helvetica, sans-serif;}
        table{
            width:400px;
            height: 250px;
    
        }
        td{
            border: 1px solid black;
            text-align: center;
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td colspan="4">A</td>
            <td rowspan="4">B</td>
        </tr>
        <tr>
            <td rowspan="4">C</td>
            <td>D</td>
            <td>E</td>
            <td>F</td>
           
            
        </tr>
        <tr>
            <td>G</td>
            <td>G</td>
            <td>I</td>
            
           
        </tr>
        <tr>
            <td>J</td>
            <td>L</td>
            <td>M</td>
           
        </tr>
        <tr>
            <td colspan="4">N</td>
        </tr>
        <tr>
           
            
        </tr>
        <tr>
            
           
        </tr>
    </table>
    
</body>
</html>
